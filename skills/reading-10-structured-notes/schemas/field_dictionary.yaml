schema_version: "3.0.0"
skill: "reading-10-structured-notes"
anchor_format:
  single_paper: "<element_id> (e.g. p3_b04, tab_1, fig_2, eq_1)"
  multi_paper: "<paper_id>:<element_id> (e.g. paper_2:p3_b04)"
  markdown_display: "[p.<page> §<section_id> <anchor>]"
notes_fields:
  bibliography: "title, authors, year, venue, identifier (DOI or arXiv)"
  sections: "Ordered matching paper outline; role in {motivation, background, method, experiment, result, discussion, conclusion, appendix}"
  card:
    research_question: "Core problem or hypothesis with evidence"
    data_materials: "Datasets, catalysts, samples, or experimental materials"
    method: "Architecture, formulation, or experimental protocol"
    conditions: "Operating conditions, budgets, hyperparameters, and constraints"
    key_findings: "Quantitative results with metric, value, comparator, condition, and evidence"
    conclusions: "Main takeaways supported by evidence"
    limitations: "Author-stated or reader-inferred caveats"
    not_reported: "Explicit missing items with searched section IDs"
  knowledge: "Searchable concepts, variables, methods, datasets, metrics, and results"
verification_codes:
  exact: "Normalized quote found inside named anchor"
  relocated: "Normalized quote found in another block/table; anchor auto-updated and logged"
  fuzzy: "Difflib sliding-window similarity >= 0.90"
  unverified: "Quote could not be grounded in source material (must fix)"
  too_short: "Non-numeric/non-table quote shorter than 12 normalized chars"
  number_not_in_evidence: "Numeric value in note/answer absent from evidence and derived_values"
  negation_dropped: "Negation present in quote omitted in note/answer"
  hedge_dropped: "Hedging modality present in quote omitted in note/answer"
