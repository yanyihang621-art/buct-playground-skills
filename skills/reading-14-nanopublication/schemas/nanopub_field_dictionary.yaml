schema_version: "1.0.0"
name: "Nanopublication 4-Graph Field Dictionary"

named_graphs:
  head:
    description: "Links the nanopub_uri to its assertion, provenance, and pubinfo named graphs."
    fields: ["nanopub_uri", "assertion_graph", "provenance_graph", "pubinfo_graph"]
  assertion:
    description: "Single atomic, truth-evaluable scientific triple with scope/condition qualifiers."
    fields:
      - "subject"
      - "predicate (must be in relation_vocabulary.yaml)"
      - "predicate_uri"
      - "object"
      - "modality (asserted | hedged) and polarity (affirmative | negative surface assertion)"
      - "conditions (array of temperature/pressure/scope qualifiers)"
      - "atomic_statement (<= 280 chars, single claim)"
  provenance:
    description: "Minimal sufficient supporting evidence snippet, exact location, evidence_type, and source paper metadata."
    fields:
      - "evidence_type (direct_experimental | direct_tabular_or_figure | direct_textual | indirect_inference | cited_prior_work)"
      - "minimal_evidence_snippet (verbatim clause for prose); condition_quote (separate scope text)"
      - "location (source-scoped block/table ID; physical PDF page/bbox, actual text lines, JSON Pointer or XML element path)"
      - "original_id is a supplied paragraph id. row_index is one-based among table data rows. column_name and row_label identify the exact cell quoted."
      - "cross_element_refs"
      - "source_metadata (paper_title, authors, year, doi, version, source_file, source_sha256)"
      - "supporting_evidences (merged anchors after deduplication)"
  pubinfo:
    description: "Nanopublication creation timestamp, creator tool, confidence score, and deterministic confidence_basis."
    fields: ["created_at", "creator", "version", "confidence_score", "confidence_basis"]

quality_gates:
  - code: "over_broad_assertion"
    rule: "Assertion must express one atomic verifiable claim (<= 1 sentence break, <= 280 chars, no unsplit compound claims)."
  - code: "invalid_relation_type"
    rule: "Assertion predicate must belong to schemas/relation_vocabulary.yaml."
  - code: "assertion_evidence_contradiction"
    rule: "Predicate polarity must not contradict explicit negation/antonym signals inside minimal_evidence_snippet."
  - code: "evidence_not_grounded"
    rule: "Verify document hash and physical page or lines. Prose quotes and separate scope text match the source. For tables verify the selected row, column and value."
  - code: "entity_confusion"
    rule: "Core subject entity tokens must appear in the supporting evidence snippet or table/caption context."
  - code: "missing_provenance_metadata"
    rule: "All 4 named graphs, nanopub_uri, source_metadata, and confidence_basis must be populated; use not_reported for absent DOI/year."
  - code: "cross_assertion_conflict"
    rule: "Flag pairs sharing (subject, object) with mutually contradicting predicates."

not_reported_policy:
  marker: "not_reported"
  rule: "Never invent missing DOIs, publication years, authors, or unsupported triples."
