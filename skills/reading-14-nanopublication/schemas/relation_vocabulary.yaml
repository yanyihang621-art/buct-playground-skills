schema_version: "1.0.0"
vocabulary_name: "Scientific Nanopublication Controlled Relation Vocabulary"
relations:
  - id: "causes"
    uri: "http://purl.obolibrary.org/obo/RO_0002410"
    label: "causally related to / causes"
    polarity: "positive"
    symmetric: false
    contradicts: ["does_not_affect", "inhibits"]
    triggers_en: ["causes", "induces", "leads to", "results in", "triggers", "drives"]
    triggers_zh: ["导致", "引起", "诱发", "产生"]
  - id: "increases"
    uri: "http://purl.obolibrary.org/obo/RO_0002213"
    label: "positively regulates / increases"
    polarity: "positive"
    symmetric: false
    contradicts: ["decreases", "inhibits", "does_not_affect"]
    triggers_en: ["increases", "enhances", "elevates", "boosts", "promotes", "raises", "accelerates"]
    triggers_zh: ["提高", "增加", "促进", "增强", "提升"]
  - id: "decreases"
    uri: "http://purl.obolibrary.org/obo/RO_0002212"
    label: "negatively regulates / decreases"
    polarity: "negative"
    symmetric: false
    contradicts: ["increases", "improves", "does_not_affect"]
    triggers_en: ["decreases", "reduces", "lowers", "suppresses", "diminishes", "attenuates"]
    triggers_zh: ["降低", "减少", "削弱", "衰减"]
  - id: "inhibits"
    uri: "http://purl.obolibrary.org/obo/RO_0002449"
    label: "inhibits / blocks"
    polarity: "negative"
    symmetric: false
    contradicts: ["increases", "catalyzes", "improves", "does_not_affect"]
    triggers_en: ["inhibits", "blocks", "poisons", "deactivates", "hinders", "prevents"]
    triggers_zh: ["抑制", "阻断", "中毒失活", "阻碍"]
  - id: "catalyzes"
    uri: "http://purl.obolibrary.org/obo/RO_0002327"
    label: "catalyzes"
    polarity: "positive"
    symmetric: false
    contradicts: ["inhibits", "does_not_affect"]
    triggers_en: ["catalyzes", "catalyses", "mediates", "facilitates conversion"]
    triggers_zh: ["催化", "介导"]
  - id: "improves"
    uri: "https://w3id.org/np/vocab/improves"
    label: "improves performance/stability"
    polarity: "positive"
    symmetric: false
    contradicts: ["decreases", "inhibits", "fails_under"]
    triggers_en: ["improves", "stabilizes", "extends lifetime"]
    triggers_zh: ["改善", "稳定", "延长寿命"]
  - id: "outperforms"
    uri: "https://w3id.org/np/vocab/outperforms"
    label: "outperforms baseline"
    polarity: "positive"
    symmetric: false
    contradicts: ["equivalent_to"]
    triggers_en: ["outperforms", "surpasses", "exceeds"]
    triggers_zh: ["优于", "超越"]
  - id: "achieves_metric"
    uri: "http://semanticscience.org/resource/SIO_000216"
    label: "achieves quantitative measurement"
    polarity: "neutral"
    symmetric: false
    contradicts: []
    triggers_en: ["achieves", "reaches", "exhibits", "yields", "delivers", "shows"]
    triggers_zh: ["达到", "实现", "表现出"]
  - id: "correlates_with"
    uri: "http://semanticscience.org/resource/SIO_000772"
    label: "statistically correlates with"
    polarity: "neutral"
    symmetric: true
    contradicts: ["does_not_affect"]
    triggers_en: ["correlates with", "scales linearly with", "is proportional to"]
    triggers_zh: ["正相关", "负相关", "线性相关"]
  - id: "associates_with"
    uri: "http://semanticscience.org/resource/SIO_000001"
    label: "is associated with"
    polarity: "neutral"
    symmetric: true
    contradicts: ["does_not_affect"]
    triggers_en: ["is associated with", "co-occurs with", "links to"]
    triggers_zh: ["相关联", "伴随"]
  - id: "has_property"
    uri: "http://semanticscience.org/resource/SIO_000223"
    label: "has measured property"
    polarity: "neutral"
    symmetric: false
    contradicts: []
    triggers_en: ["has", "possesses", "contains", "displays"]
    triggers_zh: ["具有", "含有"]
  - id: "measured_at"
    uri: "https://w3id.org/np/vocab/measured_at"
    label: "measured under experimental condition"
    polarity: "neutral"
    symmetric: false
    contradicts: []
    triggers_en: ["measured at", "operated at", "tested at", "evaluated at"]
    triggers_zh: ["测定于", "操作于", "测试条件为"]
  - id: "requires_condition"
    uri: "https://w3id.org/np/vocab/requires_condition"
    label: "requires precondition"
    polarity: "neutral"
    symmetric: false
    contradicts: ["does_not_affect"]
    triggers_en: ["requires", "depends on", "needs"]
    triggers_zh: ["需要", "依赖于"]
  - id: "restricted_to"
    uri: "https://w3id.org/np/vocab/restricted_to"
    label: "scope restricted to"
    polarity: "neutral"
    symmetric: false
    contradicts: []
    triggers_en: ["is restricted to", "only valid under", "applies only to"]
    triggers_zh: ["仅限于", "仅适用于"]
  - id: "fails_under"
    uri: "https://w3id.org/np/vocab/fails_under"
    label: "fails or degrades under"
    polarity: "negative"
    symmetric: false
    contradicts: ["improves"]
    triggers_en: ["fails under", "degrades under", "loses activity under"]
    triggers_zh: ["失效于", "失活于"]
  - id: "does_not_affect"
    uri: "https://w3id.org/np/vocab/does_not_affect"
    label: "has no significant effect on"
    polarity: "negative"
    symmetric: false
    contradicts: ["causes", "increases", "decreases", "inhibits", "catalyzes", "correlates_with", "associates_with"]
    triggers_en: ["does not affect", "has no significant effect on", "shows negligible impact on"]
    triggers_zh: ["不影响", "无显著影响"]
  - id: "composed_of"
    uri: "http://semanticscience.org/resource/SIO_000028"
    label: "composed of / synthesized from"
    polarity: "neutral"
    symmetric: false
    contradicts: []
    triggers_en: ["is composed of", "consists of", "synthesized from"]
    triggers_zh: ["由...组成", "合成自"]
  - id: "equivalent_to"
    uri: "http://www.w3.org/2002/07/owl#sameAs"
    label: "equivalent to / alias of"
    polarity: "neutral"
    symmetric: true
    contradicts: ["outperforms"]
    triggers_en: ["is equivalent to", "denotes", "abbreviated as"]
    triggers_zh: ["等价于", "简称为"]
