schema_version: "3.0.0"
skill: "reading-14-nanopublication"
nanopub_graphs:
  head: "<base>/head (np:Nanopublication, hasAssertion, hasProvenance, hasPublicationInfo)"
  assertion: "<base>/assertion (always reified rdf:Statement; direct triple emitted iff affirmative & asserted)"
  provenance: "<base>/provenance (prov:wasDerivedFrom -> evidence node with prov:value, page, anchor, evidenceType, prov:wasQuotedFrom)"
  pubinfo: "<base>/pubinfo (dct:created, dct:creator, dct:license CC-BY-4.0, source title/creator/date/identifier)"
claim_fields:
  id: "Unique local claim ID (e.g. c1)"
  paper_id: "Ingested paper identifier (default paper_1)"
  section: "Section identifier or heading"
  statement: "Single independently truth-evaluable atomic sentence"
  subject: "Primary entity or intervention"
  predicate: "Controlled predicate from schemas/predicates.yaml"
  object: "Target entity, property, or outcome"
  qualifiers: "condition, system_or_population, value, unit, comparator"
  polarity: "affirmative | negative"
  modality: "asserted | hedged | hypothesized"
  evidence: "List of {anchor, quote} verbatim from source"
  evidence_type: "direct_experimental | direct_table_figure | author_statement | indirect_inference | cited_prior_work | hypothesis"
  confidence: "0.0 - 1.0"
  confidence_basis: "Short justification referencing evidence strength"
validation_codes:
  unverified_quote: "Quote could not be verified in source (must fix)"
  possibly_compound: "Statement appears to combine multiple clauses or distinct-unit values"
  hedge_mismatch: "Quote contains hedging marker while modality is asserted"
  negation_dropped: "Quote contains negation while polarity is affirmative and statement lacks negation"
  uncontrolled_predicate: "Predicate outside 22 controlled predicates (associated_with candidate noted)"
  number_not_in_evidence: "Numeric value missing from evidence quote/block"
