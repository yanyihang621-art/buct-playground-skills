schema_version: "1.0.0"
queries:
  - id: "cross_paper_shared_concepts"
    description: "Find canonical concepts shared across >= 2 independent papers along with merge_decisions and do_not_merge_records."
  - id: "entity_neighborhood"
    description: "Retrieve a 1-hop subgraph around a node or label. Specify source_id to resolve an acronym within one paper."
  - id: "paper_evidence"
    description: "Retrieve the relations of a given source_id with replayable paragraph locators, conditions and source quotations."
  - id: "method_metric_comparison"
    description: "Compare Material/Method -> Metric/Finding edges grouped strictly by source_id and conditions without merging outcomes."
  - id: "conflict_and_boundary_audit"
    description: "Inspect cross-paper/intra-paper conflicts, evidence_strength distribution, and unverifiable/not_reported items."
  - id: "relation_evidence_probe"
    description: "Use direction=forward and relation to check a specified directed claim. direction=either retrieves relations in both directions. Inspect evidence_strength and has_direct_observation to distinguish an author's observations from citations or hypotheses."
