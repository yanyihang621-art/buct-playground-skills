schema_version: "1.0.0"
ontology_name: "Scientific Literature Knowledge Graph Ontology"

entity_types:
  - Researcher
  - Material
  - MaterialInstance
  - Method
  - MethodInstance
  - Model
  - ModelInstance
  - Dataset
  - DatasetInstance
  - Instrument
  - InstrumentInstance
  - Task
  - Metric
  - Condition
  - Finding

relation_types:
  - id: "uses"
    polarity: "neutral"
    contradicts: []
  - id: "evaluates_on"
    polarity: "neutral"
    contradicts: []
  - id: "achieves"
    polarity: "positive"
    contradicts: ["contradicts"]
  - id: "compares_with"
    polarity: "neutral"
    contradicts: []
  - id: "outperforms"
    polarity: "positive"
    contradicts: ["contradicts"]
  - id: "increases"
    polarity: "positive"
    contradicts: ["decreases", "inhibits"]
  - id: "decreases"
    polarity: "negative"
    contradicts: ["increases"]
  - id: "inhibits"
    polarity: "negative"
    contradicts: ["increases", "catalyzes"]
  - id: "catalyzes"
    polarity: "positive"
    contradicts: ["inhibits"]
  - id: "supports"
    polarity: "positive"
    contradicts: ["contradicts"]
  - id: "contradicts"
    polarity: "negative"
    contradicts: ["supports"]
  - id: "restricted_to"
    polarity: "neutral"
    contradicts: []
  - id: "instance_of"
    polarity: "neutral"
    contradicts: []
  - id: "authored_by"
    polarity: "neutral"
    contradicts: []

evidence_strength_tiers:
  - direct_author_evidence
  - direct_tabular_evidence
  - prior_work_citation
  - indirect_speculation

alignment_policy:
  merge_allowed:
    - "Resolve each acronym using definitions in its own source. Align across papers only when the expansions and scientific objects agree."
    - "Case and hyphenation normalization of abstract concepts or tasks"
  do_not_merge_required:
    - "Preserve distinct source-bound meanings when two papers define the same written abbreviation differently."
    - "A common material, method, model or dataset term does not establish a common sample, fitted model, physical run or data split. Keep each paper's instances linked to the generic concept via instance_of."
    - "Never treat multiple file formats (e.g., JSON + Markdown) of the same paper as independent cross-paper evidence."
